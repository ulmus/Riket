# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: I Rikets Tjänst
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: null
  locale: sv-SE
  baseUrl: riket.exostra.se
  ignorePatterns:
    - private
    - templates
    - .obsidian
    # Excluded from the published site: this ~45 MiB SLP compendium exceeds
    # Cloudflare Pages' 25 MiB per-file limit. Smaller PDFs (e.g. the Pass
    # props) are published normally. The file is generated via
    # build-pdf-karaktärer.sh and remains in the repo.
    - "**/Karaktärer I Rikets Tjänst.pdf"
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Saira Condensed
      body: Source Serif 4
      code: IBM Plex Mono
    colors:
      # Palette derived from the character sheet (charsheet/sheet.html) and the
      # RT-1 personnel-file form. Light mode = the typed dossier on cool cream
      # paper: near-black ink, neutral-grey form rules, true-navy headings and
      # bold, with an antique-gold accent (the emblem's crown).
      lightMode:
        light: "#f0efe9" # paper background (cool cream)
        lightgray: "#d8d4c7" # rules / faint borders (form lines)
        gray: "#7a786e" # muted grey (secondary text, distant graph nodes)
        darkgray: "#1c1d22" # ink (body text, near-black)
        dark: "#173a5c" # navy (headings, bold)
        secondary: "#173a5c" # navy (links)
        tertiary: "#a9781f" # antique gold (hover, active graph node)
        highlight: rgba(207, 169, 78, 0.20) # gold wash (internal-link bg)
        textHighlight: "#cfa94e88" # gold marker (==highlight==)
      # Dark mode = the cover / classified folder: deep navy, cream text, gold.
      darkMode:
        light: "#0c3a54" # navy background
        lightgray: "#235874" # rules / faint borders
        gray: "#9fb3c4" # steel blue (secondary text)
        darkgray: "#e7e0ce" # warm cream (body text)
        dark: "#f2ecdb" # bright cream (headings)
        secondary: "#e8c25a" # gold (links)
        tertiary: "#f3d585" # bright gold (hover, active graph node)
        highlight: rgba(232, 194, 90, 0.15)
        textHighlight: "#e8c25a88"
plugins:
  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  - source: github:quartz-community/table-of-contents
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: github:quartz-community/description
    enabled: true
    order: 70
  - source: github:quartz-community/latex
    enabled: false
    options:
      renderEngine: katex
    order: 80
  - source: github:quartz-community/citations
    enabled: false
    order: 85
  - source: github:quartz-community/hard-line-breaks
    enabled: false
    order: 90
  - source: github:quartz-community/ox-hugo
    enabled: false
    order: 91
  - source: github:quartz-community/roam
    enabled: false
    order: 92
  - source: github:quartz-community/fonts
    enabled: true
  - source: github:quartz-community/remove-draft
    enabled: true
  - source: github:quartz-community/explicit-publish
    enabled: false
  - source: github:quartz-community/alias-redirects
    enabled: true
  - source: github:quartz-community/content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: github:quartz-community/favicon
    enabled: true
  - source: github:quartz-community/og-image
    enabled: true
  # Disabled: the site is hosted on Cloudflare Pages at the riket.exostra.se
  # subdomain. The custom domain is configured in the Cloudflare dashboard, not
  # via a CNAME file, so none should be emitted. See DEPLOYMENT.md.
  - source: github:quartz-community/cname
    enabled: false
  - source: github:quartz-community/canvas-page
    enabled: true
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/folder-page
    enabled: true
  - source: github:quartz-community/tag-page
    enabled: true
  - source: github:quartz-community/explorer
    enabled: true
    layout:
      position: left
      priority: 50
  # Disabled: the interactive graph in the right sidebar is not wanted.
  - source: github:quartz-community/graph
    enabled: false
    layout:
      position: right
      priority: 10
  - source: github:quartz-community/search
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: github:quartz-community/backlinks
    enabled: true
    layout:
      position: right
      priority: 50
  - source: github:quartz-community/article-title
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: github:quartz-community/content-meta
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: github:quartz-community/tag-list
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: github:quartz-community/page-title
    enabled: true
    layout:
      position: left
      priority: 10
  - source: github:quartz-community/darkmode
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: github:quartz-community/reader-mode
    enabled: false
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: github:quartz-community/breadcrumbs
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: github:quartz-community/comments
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: github:quartz-community/footer
    enabled: false
    options:
      links:
        GitHub: https://github.com/jackyzha0/quartz
        Discord Community: https://discord.gg/cRFFHYye7t
  - source: github:quartz-community/recent-notes
    enabled: false
  - source: github:quartz-community/spacer
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: github:quartz-community/bases-page
    enabled: true
    options: {}
    order: 50
  - source: github:quartz-community/note-properties
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: github:quartz-community/unlisted-pages
    enabled: true
    options: {}
    order: 45
  - source: github:quartz-community/encrypted-pages
    enabled: false
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
    order: 900
    layout:
      position: body
      priority: 100
      display: all
  - source: github:quartz-community/stacked-pages
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
