title: I Rikets Tjänst
description: Ett taktiskt superhjälte-rollspel under kalla kriget
baseurl: "/Riket"
url: ""

permalink: pretty

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-optional-front-matter
  - jekyll-default-layout
  - jekyll-relative-links
  - jekyll-titles-from-headings

titles_from_headings:
  enabled: true

defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - AGENTS.md
  - CLAUDE.md
  - Kampanj.md
  - build-pdf.sh
  - build-pdf-karaktärer.sh
  - build-lib.sh
  - Manuskript.md
  - karaktär.css
  - regler.css
  - publish.css
  - pdf/
  - Assets/charsheet/
  - Assets/*.pxd
  - "*.pxd"
  - .markdownlint.json
  - .claude/
  - .obsidian/
  - Gemfile
  - Gemfile.lock
  - vendor/
