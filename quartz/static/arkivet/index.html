<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personalakts-arkivet · I Rikets Tjänst</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=Courier+Prime:wght@400;700&family=Saira+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --paper:#EDE7D8; --panel:#F5F1E6; --ink:#23201A; --ink-soft:#8A8268; --rule:#C7BEA6; --accent:#0C3A54; }
  * { box-sizing: border-box; }
  body { margin:0; background:#2b2a26; color:#f3ecdb; font-family:'Archivo',sans-serif; min-height:100vh; padding:40px 20px 60px; }
  .wrap { max-width:980px; margin:0 auto; }
  header.masthead { display:flex; align-items:center; gap:14px; border:2px solid #000; background:var(--panel); color:var(--ink); border-radius:8px; padding:14px 18px; }
  header.masthead img { width:54px; height:54px; object-fit:contain; flex:none; }
  header.masthead .t { font:600 9px/1.3 'Archivo'; letter-spacing:.22em; text-transform:uppercase; color:var(--ink-soft); }
  header.masthead h1 { margin:2px 0 0; font:800 30px/0.95 'Saira Condensed',sans-serif; letter-spacing:.02em; text-transform:uppercase; color:var(--ink); }
  @media (max-width:560px){ header.masthead h1 { font-size:24px; } }
</style>
</head>
<body>
  <div class="wrap">
    <header class="masthead">
      <img src="assets/irt-logo.png" alt="Program Frigg">
      <div>
        <div class="t">I Rikets Tjänst · Program Frigg</div>
        <h1>Personalakts-arkivet</h1>
      </div>
    </header>

    <!-- The library (local + cloud + trash + importable pre-gens) is rendered
         here by store.js. -->
    <div id="irt-gallery"><div class="irt-empty" style="padding:40px 2px;font-family:'Courier Prime',monospace;color:#9b937f;">Laddar arkivet…</div></div>
  </div>

  <script src="./store.js"></script>
</body>
</html>
